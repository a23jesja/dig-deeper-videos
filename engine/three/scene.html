<script type="module">
// Sir Digsworth 3D world. Driven frame-by-frame from Python (engine/three3d.py).
import * as THREE from 'three';
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);

// ------------------------------------------------------------------ helpers
const ramp = new THREE.DataTexture(new Uint8Array([150, 150, 160, 255, 210, 210, 215, 255, 255, 255, 255, 255]), 3, 1);

const matCache = {};
const toon = (c, extra = {}) => new THREE.MeshToonMaterial(Object.assign({color: c, gradientMap: ramp}, extra));

const INK = new THREE.MeshBasicMaterial({color: '#1d1a22', side: THREE.BackSide});

function mesh(geo, color, outline = 0.035, shadow = true) {

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;

function skyDome(top, bottom, offset = 0) {

    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {top: {value: new THREE.Color(top)}, bottom: {value: new THREE.Color(bottom)}, off: {value: offset}},
    vertexShader: 'varying vec3 vP; void main(){ vP = (modelMatrix*vec4(position,1.0)).xyz; gl_Position = projectionMatrix*viewMatrix*vec4(vP,1.0); }',

  });

function starField(n, r, size, seed, minY = 0.05) {
  const R = rng(seed), pos = [];

    const th = R() * Math.PI * 2, y = minY + R() * (1 - minY), rr = Math.sqrt(1 - y * y);

}
function hillyGround(color, amp = 0.9, flat = 7, size = 160, seg = 90, f1 = 0.18, f2 = 0.21) {

}
function farHills(list) {

  for (const [x, z, r, c, sy = 0.55] of list) { const h = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 14), toonC(c)); h.position.set(x, -r * sy, z); g.add(h); }
  return g;
}
function pine(x, z, s, col = '#4f8f3e', snow = false) {
  const t = new THREE.Group();
  const trunk = mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.9, 8), '#7a4a2a'); trunk.position.y = 0.45; t.add(trunk);
  for (let k = 0; k < 3; k++) {
    const c = mesh(new THREE.ConeGeometry(0.85 - k * 0.2, 1.15, 10), col, 0.03); c.position.y = 1.2 + k * 0.55; t.add(c);
    if (snow) { const sn = mesh(new THREE.ConeGeometry(0.45 - k * 0.1, 0.45, 10), '#ffffff', 0.04); sn.position.y = 1.6 + k * 0.55; t.add(sn); }
  }

}
function roundTree(x, z, s, col = '#6aa84f') {
  const t = new THREE.Group();
  const trunk = mesh(new THREE.CylinderGeometry(0.13, 0.18, 1.3, 8), '#7a4a2a'); trunk.position.y = 0.65; t.add(trunk);
  for (const [a, b, c, r] of [[0, 1.75, 0, 0.8], [0.45, 1.45, 0.1, 0.55], [-0.45, 1.5, -0.1, 0.6], [0, 2.2, 0, 0.55]]) {

function cloud(x, y, z, s = 1, col = '#ffffff') {

}

    g.fillStyle = base; g.fillRect(0, 0, w, h); g.strokeStyle = line; g.lineWidth = 3;
    for (let k = 0; k <= 8; k++) { g.beginPath(); g.moveTo(0, k * 32); g.lineTo(w, k * 32); g.stroke(); }

}

  const g = new THREE.Group();

  const fr = '#f4efe6';
  for (const [x, y, ww, hh] of [[0, h / 2, w + 0.2, 0.12], [0, -h / 2, w + 0.2, 0.12], [-w / 2, 0, 0.12, h], [w / 2, 0, 0.12, h], [0, 0, 0.07, h], [0, 0, w, 0.07]]) {
    const b = box(ww, hh, 0.08, fr, 0.04); b.position.set(x, y, 0.04); g.add(b);

// ------------------------------------------------------------------ lights (re-tuned per world)

sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, {left: -10, right: 10, top: 10, bottom: -10}); scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight('#ffffff', 0.5); fill.position.set(-2, 3, 10); scene.add(fill);

// ------------------------------------------------------------------ worlds
const worlds = {}; let active = null; let isPortrait = false;
function world(kind) {

  const R = rng(kind.length * 977 + 13);
  const add = o => (g.add(o), o);
  const driftClouds = (list, speed = 0.25) => { const cs = list.map(a => add(cloud(...a))); upd.push(t => cs.forEach((c, k) => c.position.x = list[k][0] + ((t * speed + k * 7) % 60) - 20)); };
  if (kind === 'meadow' || kind === 'forest' || kind === 'split') {

    add(skyDome(forest ? '#9fd9c8' : '#ffb98a', forest ? '#f3f0d8' : '#ffe6c8', 0.02));
    add(hillyGround(forest ? '#7fae55' : '#a8c66c'));
    add(farHills([[-22, -34, 14, '#8fb35e'], [10, -40, 18, '#9cbf68'], [34, -30, 12, '#86ab57']]));

  } else if (kind === 'night') {

    const ff = []; for (let k = 0; k < 18; k++) { const f = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), basic('#fff38a')); add(f); ff.push([f, (R() - 0.5) * 16, 0.5 + R() * 2.5, -1 - R() * 8, R() * 6]); }
    upd.push(t => ff.forEach(([f, x, y, z, p]) => { f.position.set(x + Math.sin(t * 0.7 + p) * 0.6, y + Math.sin(t * 1.3 + p) * 0.3, z); f.material.opacity = 1; f.scale.setScalar(0.6 + 0.4 * Math.sin(t * 3 + p)); }));
    L.sky = '#8fa0ff'; L.gnd = '#2a3b38'; L.hemi = 0.9; L.sun = '#c8d4ff'; L.sunI = 1.4; L.sunPos = [-8, 12, 6]; L.fog = ['#3a4278', 22, 90]; L.fill = 0.8;
  } else if (kind === 'space' || kind === 'sky' && false) {

    L.sky = '#d8d0ff'; L.gnd = '#3a2f55'; L.hemi = 0.8; L.sun = '#ffffff'; L.sunI = 2.6; L.sunPos = [8, 9, 6]; L.fog = null; L.fill = 0.7;
  } else if (kind === 'sky') {

    const plat = new THREE.Group();

    const top = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 0.6, 32), toonC('#ffffff')); top.position.y = -0.3; top.receiveShadow = true; plat.add(top);
    add(plat);

    L.sky = '#ffffff'; L.gnd = '#9fd0ff'; L.hemi = 1.3; L.sunI = 2.0; L.fog = ['#cfeaff', 30, 120];
  } else if (kind === 'ocean') {
    add(skyDome('#6cc4ff', '#e6f7ff', 0.0));
    const wg = new THREE.PlaneGeometry(220, 220, 110, 110); wg.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(wg, toon('#2f9bd6', {})); water.position.y = -0.35; water.receiveShadow = true; add(water);

    const isl = new THREE.Mesh(new THREE.SphereGeometry(7, 40, 20), toonC('#f2d79c')); isl.scale.set(1.2, 0.12, 0.7); isl.position.set(0, -0.48, -0.5); isl.receiveShadow = true; add(isl);
    const palm = new THREE.Group(); const tr = mesh(new THREE.CylinderGeometry(0.12, 0.2, 3.2, 8), '#a0703a'); tr.position.y = 1.6; tr.rotation.z = 0.15; palm.add(tr);
    for (let k = 0; k < 6; k++) { const lf = mesh(new THREE.ConeGeometry(0.3, 2.2, 6), '#4caf50', 0.04); lf.position.set(Math.cos(k) * 0.8 + 0.25, 3.1, Math.sin(k) * 0.8); lf.rotation.set(Math.sin(k) * 1.2, 0, -Math.cos(k) * 1.3); palm.add(lf); }

    add(hillyGround('#f4f7fb')); add(farHills([[-22, -34, 14, '#e6eef8'], [10, -40, 18, '#eef3fa'], [34, -30, 12, '#dfe9f5']]));
    for (let k = 0; k < 10; k++) { const x = (R() - 0.5) * 30, z = -5 - R() * 14; if (Math.abs(x) < 3) continue; add(pine(x, z, 0.9 + R() * 0.7, '#3f7d5a', true)); }

    const lava = new THREE.Mesh(new THREE.CircleGeometry(3.2, 24), basic('#ff6a1a')); lava.rotation.x = -Math.PI / 2; lava.position.y = 12.5; vol.add(lava);
    for (let k = 0; k < 5; k++) { const st = new THREE.Mesh(new THREE.BoxGeometry(0.5, 6, 0.1), basic('#ff7a2a')); st.position.set(Math.cos(k * 1.3) * 5, 6, Math.sin(k * 1.3) * 5 + 4); st.rotation.set(0, k, 0.4 * Math.cos(k)); }
    vol.position.set(6, 0, -34); add(vol);
    const smoke = []; for (let k = 0; k < 8; k++) { const s_ = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 1), toon('#6b5a5a', {transparent: true, opacity: 0.8})); add(s_); smoke.push(s_); }
    const em = [], en = 120; for (let k = 0; k < en; k++) em.push((R() - 0.5) * 20, R() * 8, 2 - R() * 14);

const monGlass = new THREE.Mesh(new THREE.CircleGeometry(0.11, 24), new THREE.MeshBasicMaterial({color: '#cfe8ff', transparent: true, opacity: 0.25})); monGlass.position.set(0.17, 0.08, 0.505); head.add(monGlass);
for (const sx of [-1, 1]) {
  const mu = mesh(new THREE.TorusGeometry(0.11, 0.035, 10, 20, Math.PI * 0.9), '#5a3a20', 0.1);
  mu.position.set(sx * 0.1, -0.09, 0.475); mu.rotation.set(0, 0, sx > 0 ? Math.PI * 1.05 : -Math.PI * 0.05 + Math.PI); mu.scale.set(sx, 1, 1); head.add(mu);
}
const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), basic('#3a1c1c')); mouth.position.set(0, -0.3, 0.405); head.add(mouth);
const brows = [];
for (const x of [-0.17, 0.17]) { const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.018, 0.12, 4, 8), basic('#1d1a22')); b.rotation.z = Math.PI / 2; b.position.set(x, 0.215, 0.46); head.add(b); brows.push(b); }
const cap = new THREE.Group();   // proper English flat cap: soft crown sloping forward onto a short stiff peak
const capMat = toon('#ffffff', {map: tweed});
const band = mesh(new THREE.CylinderGeometry(0.47, 0.455, 0.17, 36), capMat, 0.03); band.position.set(0, -0.03, -0.01); cap.add(band);
const crown = mesh(new THREE.SphereGeometry(0.5, 32, 18), capMat, 0.03); crown.scale.set(1.06, 0.34, 1.2); crown.position.set(0, 0.08, 0.07); crown.rotation.x = 0.2; cap.add(crown);
const brim = mesh(new THREE.SphereGeometry(0.3, 24, 12), '#6f5236', 0.06); brim.scale.set(1.0, 0.1, 0.62); brim.position.set(0, -0.085, 0.52); brim.rotation.x = 0.32; cap.add(brim);
const capBtn = mesh(new THREE.SphereGeometry(0.045, 10, 8), '#6f5236', 0.12); capBtn.position.set(0, 0.25, 0.0); cap.add(capBtn);
cap.position.y = 0.37; cap.rotation.x = -0.05; head.add(cap);
const pipe = new THREE.Group();
const stem = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.28, 8), '#2b1d14', 0.15); stem.rotation.z = Math.PI / 2.4; stem.position.set(0.135, -0.036, 0); pipe.add(stem);
const bowl = mesh(new THREE.CylinderGeometry(0.07, 0.05, 0.15, 14), '#7b4a24', 0.1); bowl.position.set(0.285, -0.005, 0); pipe.add(bowl);
const ember = new THREE.Mesh(new THREE.CircleGeometry(0.052, 14), basic('#ff7a1a')); ember.rotation.x = -Math.PI / 2; ember.position.set(0.285, 0.072, 0); pipe.add(ember);
pipe.position.set(0.045, -0.3, 0.43); pipe.rotation.y = -0.25; head.add(pipe);   // held in the corner of the mouth, below the moustache
const puffs = [];
for (let k = 0; k < 3; k++) { const p = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshBasicMaterial({color: '#ffffff', transparent: true, opacity: 0.6})); head.add(p); puffs.push(p); }
const blob = new THREE.Mesh(new THREE.CircleGeometry(0.55, 32), new THREE.MeshBasicMaterial({color: '#000000', transparent: true, opacity: 0.0, depthWrite: false}));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.015; sir.add(blob);
sir.traverse(o => { if (o.isMesh && o.material !== INK) o.castShadow = true; });

// poses: [armL z, armL x, armR z, armR x]
const POSES = {
  idle: [-0.18, -0.15, 0.2, 0], walk: [-0.18, 0, 0.18, 0], run: [-0.3, 0, 0.3, 0], wave: [-0.18, -0.15, 2.6, 0], point: [-0.18, -0.15, 1.5, -0.25],
  wow: [-0.55, -0.3, 2.3, 0], jump: [-0.6, -0.3, 2.5, 0], think: [-0.18, -0.15, -0.45, -2.05], wipe: [-0.18, -0.15, -0.6, -2.65], shrug: [-0.5, -0.4, 1.0, -0.5],
  dig: [-0.3, -1.1, 0.3, -1.1], dizzy: [-0.4, -0.2, 0.7, 0], shiver: [-0.25, -0.6, 0.25, -0.6], sleep: [-0.12, 0, 0.12, 0], swim: [-2.6, 0, 2.6, 0], none: [-0.18, -0.15, 0.2, 0]
};
let curPose = POSES.idle.slice(); let lastT = -99; let capLift = 0;
function poseHost(h, t) {
  const act = h.act || 'idle'; const P = POSES[act] || POSES.idle;
  const snap = Math.abs(t - lastT) > 0.1; lastT = t;
  for (let k = 0; k < 4; k++) curPose[k] = snap ? P[k] : curPose[k] + (P[k] - curPose[k]) * 0.22;
  let [lz, lx, rz, rx] = curPose;
  if (act === 'wave') rz += Math.sin(t * 7.5) * 0.3;
  if (act === 'walk' || act === 'run' || act === 'swim') { const sw = Math.sin(h.step) * (act === 'run' ? 0.8 : 0.5); lx += sw; rx -= sw; legL.rotation.x = -sw; legR.rotation.x = sw; }
  else { legL.rotation.x = legR.rotation.x = 0; }
  if (act === 'dig') { lx += Math.sin(t * 9) * 0.5; rx += Math.sin(t * 9) * 0.5; }
  if (act === 'shiver') { lz += Math.sin(t * 13) * 0.04; rz -= Math.sin(t * 13) * 0.04; }
  if (act === 'swim') { lz += Math.sin(t * 5) * 0.5; rz += Math.sin(t * 5 + 3) * 0.5; }
  // talking gestures with the free hand
  if (['idle', 'point', 'shrug'].includes(act)) { rz += h.energy * 0.22 * Math.sin(t * 3.1); rx -= h.energy * 0.25 * (0.5 + 0.5 * Math.sin(t * 2.3)); }
  // point toward the facing side
  const mirror = h.facing < 0 && act === 'point';
  armL.rotation.set(lx, 0, mirror ? -rz : lz); armR.rotation.set(rx, 0, mirror ? -lz : rz);
  head.rotation.set(Math.sin(t * 2.3) * 0.04 + (act === 'sleep' ? 0.25 : 0) + (act === 'think' ? 0.1 : 0), (act === 'think' ? 0.2 : 0), Math.sin(t * 1.7) * 0.05 + h.energy * 0.05 * Math.sin(t * 2.6) + (act === 'shrug' ? 0.18 : 0) + (act === 'sleep' ? 0.2 : 0));
  const blink = h.blink || act === 'sleep';
  eyes.forEach(e => { e.scale.y = blink ? 0.12 : 1.25 * (h.eye || 1); e.scale.x = 0.85 * (h.eye || 1); });
  const up = (act === 'wow' || act === 'jump') ? 0.07 : (act === 'shrug' ? 0.05 : 0);
  brows.forEach((b, k) => { b.position.y = 0.215 + up * 0.6 + (act === 'think' && k === 1 ? 0.05 : 0); b.rotation.z = Math.PI / 2 + ((act === 'wipe' || act === 'shiver' || act === 'dizzy') ? (k ? -0.35 : 0.35) : 0); });
  capLift += (((act === 'wow' || act === 'jump') ? 0.12 : 0) - capLift) * (snap ? 1 : 0.3); cap.position.y = 0.37 + capLift;
  mouth.scale.set(1, 0.3 + (h.mouth || 0) * 1.3 + (act === 'wow' ? 0.9 : 0), 1);
  puffs.forEach((p, k) => { const ph = (t * 0.35 + k / puffs.length) % 1; p.position.set(0.36 + ph * 0.2, -0.17 + ph * 0.5, 0.5); p.scale.setScalar(0.35 + ph * 0.9); p.material.opacity = 0.38 * Math.sin(ph * Math.PI); });
}

// ------------------------------------------------------------------ emoji sprites
const texCache = {}; const spritePool = [];
window.addEmoji = async (key, url) => {
  if (texCache[key]) return true;
  const tex = await new THREE.TextureLoader().loadAsync(url); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; texCache[key] = tex; return true;
};
function getSprite(i) {
  while (spritePool.length <= i) { const s = new THREE.Sprite(new THREE.SpriteMaterial({transparent: true, depthWrite: false})); s.renderOrder = 5; scene.add(s); spritePool.push(s); }
  return spritePool[i];
}

// ------------------------------------------------------------------ camera mapping
// Base framing: at the base camera, screen point (x,y) in 0..1 maps onto the stage plane z = 0.
const BASE = {pos: new THREE.Vector3(0, 2.3, 10), look: new THREE.Vector3(0, 1.75, 0)};
const baseCam = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);
baseCam.position.copy(BASE.pos); baseCam.lookAt(BASE.look); baseCam.updateMatrixWorld(); baseCam.updateProjectionMatrix();
const ray = new THREE.Raycaster();
const portCam = new THREE.PerspectiveCamera(62, 9 / 16, 0.1, 400);
portCam.position.set(0, 3.0, 9.6); portCam.lookAt(0, 2.9, 0); portCam.updateMatrixWorld(); portCam.updateProjectionMatrix();
let rayCam = baseCam;
function screenToPlaneZ(x, y, z) {
  ray.setFromCamera(new THREE.Vector2(x * 2 - 1, -(y * 2 - 1)), rayCam);
  const t = (z - ray.ray.origin.z) / ray.ray.direction.z; return ray.ray.origin.clone().addScaledVector(ray.ray.direction, t);
}
function screenToGround(x, y) {
  ray.setFromCamera(new THREE.Vector2(x * 2 - 1, -(y * 2 - 1)), rayCam);
  const t = -ray.ray.origin.y / ray.ray.direction.y; return ray.ray.origin.clone().addScaledVector(ray.ray.direction, t);
}
const visH = z => 2 * (BASE.pos.z - z) * Math.tan(THREE.MathUtils.degToRad(19));

// ------------------------------------------------------------------ render one frame
window.setSize = (w, h) => { renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); return true; };
window.renderFrame = function (s) {
  const t = s.t; const portrait = !!s.portrait; rayCam = portrait ? portCam : baseCam; isPortrait = portrait;
  const cl = (v, a, b) => Math.min(b, Math.max(a, v));
  const PX = x => portrait ? cl(0.36 + (x - 0.3) * 0.35, 0.26, 0.6) : x;
  const w = useWorld(s.bg || 'meadow');

  const h = s.host || {show: false};

    const gp = screenToGround(PX(h.x), h.gy);
    sir.position.set(gp.x, 0, Math.min(1.5, Math.max(-2, gp.z)));
    const sc = h.size || 1; sir.scale.set(sc * (1 + (h.sq || 0)), sc * (1 - (h.sq || 0)), sc);
    body.position.y = h.bob || 0; body.rotation.z = -(h.rot || 0) * 0.8;
    sir.rotation.y = (h.facing || 1) * 0.38 + (h.turn || 0);
    blob.scale.setScalar(1 - Math.min(0.5, (h.bob || 0) * 0.6));
    poseHost(h, t);
  }
  // props
  let n = 0;
  for (const p of s.sprites || []) {
    const tex = texCache[p.key]; if (!tex) continue;
    const z = p.back ? -3.5 : 0.8;
    const sp = getSprite(n++); sp.visible = true; sp.material.map = tex; sp.material.opacity = p.a; sp.material.rotation = -p.rot; sp.material.needsUpdate = true;
    const wp = portrait ? screenToPlaneZ(0.63 + cl((p.x - 0.5) / 0.4, 0, 1) * 0.22, 0.45 + cl((p.y - 0.2) / 0.6, 0, 1) * 0.2, z) : screenToPlaneZ(p.x, p.y, z); sp.position.copy(wp);
    const hh = portrait ? p.size / 280 * 1.2 * p.sc : p.size / H * visH(z) * p.sc;
    sp.scale.set(hh * (1 + p.sq), hh * (1 - p.sq), 1);
  }
  for (let k = n; k < spritePool.length; k++) spritePool[k].visible = false;
  // camera: push-in, whip, shake, slow orbit for depth
  const c = s.cam || {};
  const zoom = c.z || 1, orbit = (c.orbit || 0);
  const target = portrait ? new THREE.Vector3(0, 2.9, 0) : BASE.look.clone(); target.x += (c.ox || 0) * (portrait ? 5 : 11); target.y += (c.oy || 0);
  const dist = (portrait ? 9.6 : (BASE.pos.z - BASE.look.z)) / zoom;
  camera.position.set(target.x + Math.sin(orbit) * dist, (portrait ? 3.0 : BASE.pos.y) + (c.lift || 0) + (c.sy || 0) * 0.004, target.z + Math.cos(orbit) * dist);
  camera.position.x += (c.sx || 0) * 0.004;
  if (c.focus) { const f = sir.position.clone(); f.y += 1.75 * (h.size || 1); target.lerp(f, c.focus); }
  camera.lookAt(target);
  camera.fov = portrait ? 62 : (c.fov || 38); camera.updateProjectionMatrix();
  sun.target.position.set(sir.position.x, 0, 0); sun.position.set(sun.position.x, sun.position.y, sun.position.z);
  renderer.render(scene, camera);
  // where his head and feet end up on screen (for speech bubbles and effects)
  const hp = new THREE.Vector3(); head.getWorldPosition(hp); hp.project(camera);
  const fp = sir.position.clone().project(camera);
  return {img: renderer.domElement.toDataURL('image/jpeg', 0.92), head: [(hp.x + 1) / 2, (1 - hp.y) / 2], feet: [(fp.x + 1) / 2, (1 - fp.y) / 2]};
};
window.ready = true;
</script></body></html>
