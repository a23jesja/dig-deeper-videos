<!DOCTYPE html><html><body style="margin:0;background:#9fd0ee">
<canvas id="c" width="3000" height="1000"></canvas>
<script type="module">
import { Pen, bodyFront, bodySide, SIR_DIGSWORTH, soldier, setTalk } from './toon.js';
const g = document.getElementById('c').getContext('2d');
const draw = (i, fn) => { g.save(); g.translate(i * 600, 0); fn(new Pen(g)); g.restore(); };
draw(0, p => bodyFront(p, SIR_DIGSWORTH, { mode: 'stand', expr: 'smile', seed: 3 }));
draw(1, p => { setTalk(0.8); bodyFront(p, SIR_DIGSWORTH, { mode: 'stand', expr: 'neutral', point: 1, seed: 3 }); setTalk(0); });
draw(2, p => bodyFront(p, SIR_DIGSWORTH, { mode: 'stand', expr: 'shock', cheer: 1, seed: 3 }));
draw(3, p => bodyFront(p, SIR_DIGSWORTH, { mode: 'stand', expr: 'nervous', shrug: 1, seed: 3, headTilt: 6 }));
draw(4, p => bodySide(p, SIR_DIGSWORTH, { mode: 'march', phase: 0.2, expr: 'stern', seed: 3 }));
window.ready = true;
</script></body></html>
